<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Registration Wireframe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <header class="p-4">
        <div class="max-w-md mx-auto flex items-center gap-3">
            <button class="w-10 h-10 border-2 border-dashed border-gray-400 rounded-lg flex items-center justify-center text-gray-600">&larr;</button>
            <div class="flex-1">
                <h1 class="text-xl font-bold text-gray-800">Vendor Signup</h1>
                <p class="text-xs text-gray-500">Business onboarding</p>
            </div>
        </div>
    </header>

    <main class="flex-1">
        <section class="max-w-md mx-auto bg-white border-2 border-dashed border-gray-400 rounded-2xl p-5 space-y-5">
            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Business Info</label>
                <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Business Name</div>
                <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Category</div>
                <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">City / Area</div>
                <div class="h-20 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Full Address</div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Contact</label>
                <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Owner Name</div>
                <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Phone Number</div>
                <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Email Address</div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Operations</label>
                <div class="grid grid-cols-2 gap-3">
                    <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Open Time</div>
                    <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Close Time</div>
                </div>
                <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Services Offered</div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Verification</label>
                <div class="h-16 border-2 border-gray-400 border-dashed rounded-lg flex items-center justify-center text-gray-500 text-sm">Upload Business Document</div>
            </div>

            <button class="w-full h-12 border-2 border-gray-800 rounded-lg text-gray-800 font-semibold tracking-wide">Submit Application</button>
        </section>
    </main>

    <nav class="bg-white border-t border-dashed border-gray-400">
        <div class="max-w-md mx-auto grid grid-cols-4">
            <button class="py-3 flex flex-col items-center text-gray-500 text-xs">
                <span class="w-8 h-8 border-2 border-gray-400 rounded-full flex items-center justify-center text-sm font-bold">🏠</span>
                Home
            </button>
            <button class="py-3 flex flex-col items-center text-gray-500 text-xs">
                <span class="w-8 h-8 border-2 border-gray-400 rounded-full flex items-center justify-center text-sm font-bold">📊</span>
                Dashboard
            </button>
            <button class="py-3 flex flex-col items-center text-gray-500 text-xs">
                <span class="w-8 h-8 border-2 border-gray-400 rounded-full flex items-center justify-center text-sm font-bold">📅</span>
                Calendar
            </button>
            <button class="py-3 flex flex-col items-center text-gray-500 text-xs">
                <span class="w-8 h-8 border-2 border-gray-400 rounded-full flex items-center justify-center text-sm font-bold">⚙️</span>
                Settings
            </button>
        </div>
    </nav>
</body>
</html>
