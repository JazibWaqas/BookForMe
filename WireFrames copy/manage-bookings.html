<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Bookings Wireframe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <header class="bg-white border-b border-dashed border-gray-400">
        <div class="max-w-md mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <h1 class="text-lg font-semibold text-gray-800">Manage Bookings</h1>
                <button class="px-3 py-2 border-2 border-gray-400 rounded-lg text-xs text-gray-600">Export CSV</button>
            </div>
            <div class="mt-3 flex gap-2 text-xs text-gray-600">
                <div class="flex-1 h-10 border-2 border-gray-400 rounded-lg flex items-center justify-center">Search name / phone</div>
                <div class="w-24 h-10 border-2 border-gray-400 rounded-lg flex items-center justify-center">Status</div>
                <div class="w-24 h-10 border-2 border-gray-400 rounded-lg flex items-center justify-center">Source</div>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto">
        <div class="max-w-md mx-auto px-4 py-6 space-y-4">
            <section class="border-2 border-dashed border-gray-400 rounded-2xl">
                <header class="grid grid-cols-[1fr_1fr_1fr] text-[11px] text-gray-500 uppercase tracking-wide border-b border-dashed border-gray-300">
                    <div class="px-3 py-2">Customer</div>
                    <div class="px-3 py-2 border-l border-dashed border-gray-300">Date &amp; Time</div>
                    <div class="px-3 py-2 border-l border-dashed border-gray-300">Status</div>
                </header>
                <div class="divide-y divide-dashed divide-gray-300 text-xs text-gray-600">
                    <article class="grid grid-cols-[1fr_1fr_1fr] px-3 py-3 items-center">
                        <div>
                            <p class="text-sm font-semibold text-gray-800">Sara Ahmed</p>
                            <p>+92 300 2222222</p>
                        </div>
                        <div>
                            <p>Oct 22</p>
                            <p>10:00 AM</p>
                            <p>WhatsApp</p>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <span class="px-2 py-1 border border-gray-400 rounded-full uppercase tracking-wide">Confirmed</span>
                            <div class="flex gap-2">
                                <button class="w-8 h-8 border-2 border-gray-400 rounded-lg text-gray-600 text-sm">✎</button>
                                <button class="w-8 h-8 border-2 border-gray-400 rounded-lg text-gray-600 text-sm">🗑️</button>
                            </div>
                        </div>
                    </article>
                    <article class="grid grid-cols-[1fr_1fr_1fr] px-3 py-3 items-center">
                        <div>
                            <p class="text-sm font-semibold text-gray-800">Ali Khan</p>
                            <p>+92 300 3333333</p>
                        </div>
                        <div>
                            <p>Oct 23</p>
                            <p>2:00 PM</p>
                            <p>Manual</p>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <span class="px-2 py-1 border border-gray-400 rounded-full uppercase tracking-wide">Pending</span>
                            <div class="flex gap-2">
                                <button class="w-8 h-8 border-2 border-gray-400 rounded-lg text-gray-600 text-sm">✎</button>
                                <button class="w-8 h-8 border-2 border-gray-400 rounded-lg text-gray-600 text-sm">🗑️</button>
                            </div>
                        </div>
                    </article>
                    <article class="grid grid-cols-[1fr_1fr_1fr] px-3 py-3 items-center">
                        <div>
                            <p class="text-sm font-semibold text-gray-800">Nadia Shah</p>
                            <p>+92 300 4444444</p>
                        </div>
                        <div>
                            <p>Oct 24</p>
                            <p>6:00 PM</p>
                            <p>App</p>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <span class="px-2 py-1 border border-gray-400 rounded-full uppercase tracking-wide">Completed</span>
                            <div class="flex gap-2">
                                <button class="w-8 h-8 border-2 border-gray-400 rounded-lg text-gray-600 text-sm">✎</button>
                                <button class="w-8 h-8 border-2 border-gray-400 rounded-lg text-gray-600 text-sm">🗑️</button>
                            </div>
                        </div>
                    </article>
                </div>
            </section>

            <button class="w-full h-12 border-2 border-gray-800 rounded-lg text-gray-800 font-semibold tracking-wide">Add Manual Booking</button>
        </div>
    </main>

    <nav class="bg-white border-t border-dashed border-gray-400">
        <div class="max-w-md mx-auto grid grid-cols-4">
            <button class="py-3 flex flex-col items-center text-gray-500 text-xs">
                <span class="w-8 h-8 border-2 border-gray-400 rounded-full flex items-center justify-center text-sm font-bold">📊</span>
                Dashboard
            </button>
            <button class="py-3 flex flex-col items-center text-gray-500 text-xs">
                <span class="w-8 h-8 border-2 border-gray-400 rounded-full flex items-center justify-center text-sm font-bold">📅</span>
                Calendar
            </button>
            <button class="py-3 flex flex-col items-center text-gray-800 text-xs font-medium">
                <span class="w-8 h-8 border-2 border-gray-800 rounded-full flex items-center justify-center text-sm font-bold">📋</span>
                Bookings
            </button>
            <button class="py-3 flex flex-col items-center text-gray-500 text-xs">
                <span class="w-8 h-8 border-2 border-gray-400 rounded-full flex items-center justify-center text-sm font-bold">⚙️</span>
                Profile
            </button>
        </div>
    </nav>
</body>
</html>
