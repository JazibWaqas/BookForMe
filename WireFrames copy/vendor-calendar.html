<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Calendar Wireframe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <header class="bg-white border-b border-dashed border-gray-400">
        <div class="max-w-md mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-lg font-semibold text-gray-800">Calendar</h1>
                    <p class="text-xs text-gray-500">Week of Nov 4</p>
                </div>
                <div class="flex gap-2">
                    <button class="w-10 h-10 border-2 border-dashed border-gray-400 rounded-lg text-gray-600">&larr;</button>
                    <button class="w-10 h-10 border-2 border-dashed border-gray-400 rounded-lg text-gray-600">&rarr;</button>
                </div>
            </div>
            <div class="mt-3 grid grid-cols-3 gap-3 text-xs text-gray-600">
                <div class="h-10 border-2 border-gray-400 rounded-lg flex items-center justify-center">Day</div>
                <div class="h-10 border-2 border-gray-400 rounded-lg flex items-center justify-center">Week</div>
                <div class="h-10 border-2 border-gray-400 rounded-lg flex items-center justify-center bg-gray-200 font-semibold text-gray-800">Month</div>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto">
        <div class="max-w-md mx-auto px-4 py-6 space-y-5">
            <section class="border-2 border-dashed border-gray-400 rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-semibold text-gray-800 uppercase tracking-wide">Filters</h2>
                    <button class="text-xs text-gray-500 underline">Reset</button>
                </div>
                <div class="grid grid-cols-2 gap-3 text-xs text-gray-600">
                    <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center justify-center">All Sources</div>
                    <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center justify-center">All Status</div>
                </div>
            </section>

            <section class="border-2 border-dashed border-gray-400 rounded-2xl p-4 space-y-3">
                <h2 class="text-sm font-semibold text-gray-800 uppercase tracking-wide">Time Slots (Nov 5)</h2>
                <div class="space-y-2 text-sm text-gray-600">
                    <div class="grid grid-cols-[80px_1fr] gap-3 items-center">
                        <span class="text-xs text-gray-500">09:00</span>
                        <div class="border border-gray-300 rounded-lg p-3 flex items-center justify-between">
                            <div>
                                <p class="text-sm font-semibold text-gray-800">Available</p>
                                <p class="text-xs text-gray-500">Tap to add booking</p>
                            </div>
                            <button class="px-3 py-2 border-2 border-gray-400 rounded-lg text-xs text-gray-600">Add</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-[80px_1fr] gap-3 items-center">
                        <span class="text-xs text-gray-500">10:00</span>
                        <div class="border border-gray-300 rounded-lg p-3 flex items-center justify-between bg-gray-50">
                            <div>
                                <p class="text-sm font-semibold text-gray-800">Sara Ahmed</p>
                                <p class="text-xs text-gray-500">WhatsApp • +92 300 2222222</p>
                            </div>
                            <button class="px-3 py-2 border-2 border-gray-800 rounded-lg text-xs font-semibold text-gray-800">View</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-[80px_1fr] gap-3 items-center">
                        <span class="text-xs text-gray-500">14:00</span>
                        <div class="border border-gray-300 rounded-lg p-3 flex items-center justify-between bg-gray-50">
                            <div>
                                <p class="text-sm font-semibold text-gray-800">Ali Khan</p>
                                <p class="text-xs text-gray-500">Manual • +92 300 3333333</p>
                            </div>
                            <button class="px-3 py-2 border-2 border-gray-800 rounded-lg text-xs font-semibold text-gray-800">View</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-[80px_1fr] gap-3 items-center">
                        <span class="text-xs text-gray-500">18:00</span>
                        <div class="border border-gray-300 rounded-lg p-3 flex items-center justify-between">
                            <div>
                                <p class="text-sm font-semibold text-gray-800">Available</p>
                                <p class="text-xs text-gray-500">Tap to add booking</p>
                            </div>
                            <button class="px-3 py-2 border-2 border-gray-400 rounded-lg text-xs text-gray-600">Add</button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="border-2 border-dashed border-gray-400 rounded-2xl p-4 space-y-3">
                <h2 class="text-sm font-semibold text-gray-800 uppercase tracking-wide">Summary</h2>
                <div class="grid grid-cols-3 gap-3 text-center text-xs text-gray-600">
                    <div class="border border-gray-300 rounded-xl p-3">
                        <p class="text-lg font-semibold text-gray-800">5</p>
                        <p>App</p>
                    </div>
                    <div class="border border-gray-300 rounded-xl p-3">
                        <p class="text-lg font-semibold text-gray-800">3</p>
                        <p>WhatsApp</p>
                    </div>
                    <div class="border border-gray-300 rounded-xl p-3">
                        <p class="text-lg font-semibold text-gray-800">2</p>
                        <p>Manual</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <nav class="bg-white border-t border-dashed border-gray-400">
        <div class="max-w-md mx-auto grid grid-cols-4">
            <button class="py-3 flex flex-col items-center text-gray-500 text-xs">
                <span class="w-8 h-8 border-2 border-gray-400 rounded-full flex items-center justify-center text-sm font-bold">📊</span>
                Dashboard
            </button>
            <button class="py-3 flex flex-col items-center text-gray-800 text-xs font-medium">
                <span class="w-8 h-8 border-2 border-gray-800 rounded-full flex items-center justify-center text-sm font-bold">📅</span>
                Calendar
            </button>
            <button class="py-3 flex flex-col items-center text-gray-500 text-xs">
                <span class="w-8 h-8 border-2 border-gray-400 rounded-full flex items-center justify-center text-sm font-bold">📋</span>
                Bookings
            </button>
            <button class="py-3 flex flex-col items-center text-gray-500 text-xs">
                <span class="w-8 h-8 border-2 border-gray-400 rounded-full flex items-center justify-center text-sm font-bold">⚙️</span>
                Profile
            </button>
        </div>
    </nav>
</body>
</html>
