<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Wireframe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <header class="p-4">
        <div class="max-w-md mx-auto flex items-center gap-3">
            <button class="w-10 h-10 border-2 border-dashed border-gray-400 rounded-lg flex items-center justify-center text-gray-600">&larr;</button>
            <div class="flex-1">
                <h1 class="text-xl font-bold text-gray-800">Create Account</h1>
                <p class="text-xs text-gray-500">Customer onboarding</p>
            </div>
        </div>
    </header>

    <main class="flex-1">
        <section class="max-w-md mx-auto bg-white border-2 border-dashed border-gray-400 rounded-2xl p-5 space-y-5">
            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Basic Details</label>
                <div class="grid grid-cols-2 gap-3">
                    <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">First Name</div>
                    <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Last Name</div>
                </div>
                <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Email Address</div>
                <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Mobile Number</div>
                <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Password</div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Preferences</label>
                <div class="space-y-2">
                    <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Preferred Sports</div>
                    <div class="h-12 border-2 border-gray-400 rounded-lg flex items-center px-3 text-gray-500 text-sm">Location</div>
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Agreements</label>
                <div class="flex items-start gap-3 border-2 border-gray-400 rounded-lg p-3">
                    <div class="w-6 h-6 border-2 border-gray-400 rounded-md"></div>
                    <p class="text-sm text-gray-600">I agree to the Terms &amp; Privacy Policy.</p>
                </div>
            </div>

            <button class="w-full h-12 border-2 border-gray-800 rounded-lg text-gray-800 font-semibold tracking-wide">Create Account</button>
        </section>
    </main>

    <nav class="bg-white border-t border-dashed border-gray-400">
        <div class="max-w-md mx-auto grid grid-cols-4">
            <button class="py-3 flex flex-col items-center text-gray-500 text-xs">
                <span class="w-8 h-8 border-2 border-gray-400 rounded-full flex items-center justify-center text-sm font-bold">🏠</span>
                Home
            </button>
            <button class="py-3 flex flex-col items-center text-gray-500 text-xs">
                <span class="w-8 h-8 border-2 border-gray-400 rounded-full flex items-center justify-center text-sm font-bold">💬</span>
                Chat
            </button>
            <button class="py-3 flex flex-col items-center text-gray-500 text-xs">
                <span class="w-8 h-8 border-2 border-gray-400 rounded-full flex items-center justify-center text-sm font-bold">👥</span>
                Social
            </button>
            <button class="py-3 flex flex-col items-center text-gray-500 text-xs">
                <span class="w-8 h-8 border-2 border-gray-400 rounded-full flex items-center justify-center text-sm font-bold">🔔</span>
                Alerts
            </button>
        </div>
    </nav>
</body>
</html>
