version: '3.8'

services:
  # PostgreSQL Database (Single Source of Truth)
  postgres:
    image: postgres:15-alpine
    container_name: bookforme_postgres
    environment:
      POSTGRES_DB: bookforme
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d bookforme"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookforme_network

  # Redis (Conversation State & Caching)
  redis:
    image: redis:7-alpine
    container_name: bookforme_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookforme_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bookforme_network:
    driver: bridge

