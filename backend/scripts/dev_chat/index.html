<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Agent Dev Chat</title>
    <style>
        :root {
            --app-bg: #0c1317;
            --app-accent: #00a884;
            --header-bg: #202c33;
            --chat-bg: #0b141a;
            --incoming-bg: #202c33;
            --outgoing-bg: #005c4b;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --input-bg: #2a3942;
            --accent: #00a884;
            --hover-bg: rgba(255,255,255,0.05);
            --max-bubble-width: 65%;
            --card-border: rgba(255,255,255,0.05);
        }

        * { box-sizing: border-box; }
        html { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--app-bg);
            color: var(--text-primary);
            margin: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 127px;
            background-color: var(--app-accent);
            z-index: 0;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            height: calc(100% - 40px);
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
            position: relative;
            z-index: 1;
            box-shadow: 0 17px 50px 0 rgba(11,20,26,.19), 0 12px 15px 0 rgba(11,20,26,.24);
        }

        header {
            background-color: var(--header-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            height: 59px;
            flex-shrink: 0;
        }

        .user-info { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, #00c792, #00a884);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .user-details h2 { margin: 0; font-size: 16px; font-weight: 500; }
        .user-details span { font-size: 13px; color: var(--text-secondary); }
        .actions button {
            background: none; border: none; color: #aebac1;
            cursor: pointer; padding: 8px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: background-color 0.2s;
        }
        .actions button:hover { background: rgba(255,255,255,0.1); }
        
        #chat-container {
            flex: 1; overflow-y: auto;
            padding: 20px 6%;
            display: flex; flex-direction: column; gap: 2px;
            /* Combine dark gradient with sports image to achieve transparency over a black bg */
            background-color: #0b141a;
            background-image: linear-gradient(rgba(11,20,26,0.92), rgba(11,20,26,0.92)), url('sports_bg.png');
            background-repeat: repeat;
            background-size: auto;
        }

        .message {
            max-width: var(--max-bubble-width);
            padding: 6px 7px 8px 9px;
            border-radius: 7.5px;
            font-size: 14.2px;
            line-height: 19px;
            position: relative;
            margin-bottom: 8px;
            box-shadow: 0 1px 0.5px rgba(11,20,26,.13);
            display: flex; flex-direction: column;
            padding-right: 65px; /* prevent text overlapping with absolute timestamp */
            padding-bottom: 12px;
        }

        .message.incoming {
            align-self: flex-start;
            background-color: var(--incoming-bg);
            border-top-left-radius: 0;
        }
        .message.incoming::before {
            content: ""; position: absolute; top: 0; left: -8px; width: 8px; height: 13px;
            background: radial-gradient(circle at top left, transparent 0, transparent 70%, var(--incoming-bg) 70%);
        }

        .message.outgoing {
            align-self: flex-end;
            background-color: var(--outgoing-bg);
            border-top-right-radius: 0;
        }
        .message.outgoing::before {
            content: ""; position: absolute; top: 0; right: -8px; width: 8px; height: 13px;
            background: radial-gradient(circle at top right, transparent 0, transparent 70%, var(--outgoing-bg) 70%);
        }

        .message-content {
            white-space: pre-wrap; word-wrap: break-word;
        }

        .message-time {
            position: absolute; right: 9px; bottom: 4px;
            font-size: 11px; color: rgba(255,255,255,0.6);
            display: flex; align-items: center; gap: 3px;
        }

        /* Adjustments for structured card messages */
        .message:has(.slot-results-card),
        .message:has(.confirmation-card) { padding-right: 9px; padding-bottom: 9px; }
        .message:has(.slot-results-card) .message-time,
        .message:has(.confirmation-card) .message-time { position: static; justify-content: flex-end; margin-top: 4px; margin-right: 0;}

        .message-status { color: #53bdeb; font-size: 13px; font-weight: normal; margin-left: 2px; letter-spacing: -2px;}

        .typing-indicator {
            display: none; align-self: flex-start;
            background-color: var(--incoming-bg);
            border-radius: 7.5px; border-top-left-radius: 0;
            padding: 12px 14px; margin-bottom: 8px; position: relative;
        }
        .typing-indicator::before {
            content: ""; position: absolute; top: 0; left: -8px; width: 8px; height: 13px;
            background: radial-gradient(circle at top left, transparent 0, transparent 70%, var(--incoming-bg) 70%);
        }
        .typing-inner { display: flex; align-items: center; gap: 8px; }
        .typing-dots { display: flex; gap: 4px; }
        .dot { width: 6px; height: 6px; background-color: var(--text-secondary); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .typing-text { font-size: 13px; color: var(--text-secondary); display: none; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.6; } 40% { transform: scale(1); opacity: 1; } }

        /* Card stylings */
        .slot-results-card { width: 100%; min-width: 250px; }
        .slot-results-header { padding-bottom: 8px; font-size: 14.5px; }
        .slot-results-header strong { color: var(--accent); }
        .venue-section { padding: 10px 0; border-top: var(--card-border); }
        .venue-header { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
        .venue-address { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 10px; }
        .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
        .slot-card {
            background: rgba(255,255,255,0.03); border-radius: 8px; padding: 10px;
            cursor: pointer; transition: background 0.2s; text-align: center;
        }
        .slot-card:hover { background: rgba(255,255,255,0.08); }
        .slot-time { font-size: 13.5px; font-weight: 500; }
        .slot-price { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .slot-select-btn {
            margin-top: 8px; width: 100%; padding: 5px 0; font-size: 13px; font-weight: 500;
            background: var(--outgoing-bg); color: #fff; border: none; border-radius: 20px; cursor: pointer;
        }
        .slot-cta { padding-top: 10px; font-size: 13px; color: var(--text-secondary); border-top: var(--card-border); margin-top: 8px; }

        .confirmation-card {
            background: rgba(0,0,0,0.15); border-radius: 8px; padding: 12px; width: 100%; min-width: 250px; position: relative;
        }
        .confirmation-header { margin-bottom: 12px; border-bottom: var(--card-border); padding-bottom: 8px; }
        .confirmation-title { font-size: 14px; font-weight: 500; color: var(--accent); }
        .confirmation-card.locked .confirmation-title { color: #f2a74c; }
        .confirmation-details { display: flex; flex-direction: column; gap: 8px; }
        .confirmation-row { display: flex; justify-content: space-between; align-items: baseline; }
        .confirmation-label { color: var(--text-secondary); font-size: 13px; }
        .confirmation-value { color: var(--text-primary); font-size: 14px; font-weight: 500; }
        .confirmation-cta { margin-top: 12px; font-size: 13px; color: var(--text-secondary); line-height: 1.4; }

        .input-area {
            background: var(--header-bg); padding: 10px 16px; display: flex; align-items: flex-end; gap: 10px; min-height: 62px;
        }
        .input-area > button {
            background: none; border: none; color: #aebac1; padding: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; height: 42px; width: 42px;
            border-radius: 50%;
        }
        .input-area > button:hover { background: rgba(255,255,255,0.05); }
        .input-wrap {
            flex: 1; background: var(--input-bg); border-radius: 8px; display: flex; align-items: center;
            min-height: 42px; padding: 9px 15px; margin: 0 4px;
        }
        #message-input {
            width: 100%; background: transparent; border: none; color: var(--text-primary); font-size: 15px; outline: none;
        }
        #message-input::placeholder { color: #8696a0; }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 3px; }

        @media (max-width: 768px) {
            body { align-items: flex-start; }
            body::before { display: none; }
            .app-container {
                height: 100%;
                max-width: 100%;
                box-shadow: none;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            header { flex-shrink: 0; }
            .message { max-width: 85%; }
            #chat-container { padding: 12px 4%; flex: 1; overflow-y: auto; }
            .input-area {
                flex-shrink: 0;
                padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header>
            <div class="user-info">
                <div class="avatar">
                    <span style="font-size:15px;font-weight:700;color:#ffffff;letter-spacing:-0.5px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">BA</span>
                </div>
                <div class="user-details">
                    <h2>Booking Agent</h2>
                    <span id="header-status">online</span>
                </div>
            </div>
            <div class="actions">
                <button onclick="clearHistory()" title="Clear Chat">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"></path></svg>
                </button>
            </div>
        </header>

        <div id="chat-container">
            <div class="typing-indicator" id="typing-indicator">
                <div class="typing-inner">
                    <div class="typing-dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <span class="typing-text" id="typing-text">Typing...</span>
                </div>
            </div>
        </div>

        <div class="input-area">
            <button onclick="document.getElementById('image-input').click()" title="Attach image">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M21.58 12.58l-9-9a6.53 6.53 0 00-9.19 9.19l1.2 1.2 1.42-1.42-1.2-1.2a4.53 4.53 0 016.36-6.36l9 9a4.53 4.53 0 01-6.36 6.36l-6.18-6.18a2.53 2.53 0 013.54-3.54l4.76 4.76 1.42-1.42-4.76-4.76a4.53 4.53 0 00-6.36 6.36l6.18 6.18a6.53 6.53 0 009.19-9.19z"></path></svg>
            </button>
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <div class="input-wrap">
                <input type="text" id="message-input" placeholder="Type a message" autocomplete="off">
            </div>
            <button id="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const API_URL = '/dev-api';
        let PHONE_NUMBER = localStorage.getItem('dev_chat_session_id');
        if (!PHONE_NUMBER) {
            PHONE_NUMBER = 'dev_' + Math.random().toString(36).slice(2, 10) + Date.now();
            localStorage.setItem('dev_chat_session_id', PHONE_NUMBER);
        }
        const MAX_SLOTS_PER_VENUE = 8;

        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const imageInput = document.getElementById('image-input');
        const typingIndicator = document.getElementById('typing-indicator');
        const typingText = document.getElementById('typing-text');

        messageInput.focus();

        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
        });

        imageInput.addEventListener('change', function () {
            if (this.files && this.files[0]) {
                uploadImage(this.files[0]);
                this.value = '';
            }
        });

        function setTypingStatus(text) {
            typingText.textContent = text || 'Typing...';
        }

        function showTyping(statusText) {
            setTypingStatus(statusText || 'Checking availability…');
            typingIndicator.style.display = 'block';
            document.getElementById('header-status').textContent = 'typing...';
            scrollToBottom();
        }

        function hideTyping() {
            typingIndicator.style.display = 'none';
            document.getElementById('header-status').textContent = 'online';
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function formatTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function parseAgentResponse(text) {
            if (!text || typeof text !== 'string') return { type: 'plain', text: text || '' };

            const trimmed = text.trim();

            const lockedMatch = trimmed.match(/Slot (?:locked|reserved)!?[^\n]*(?:Rs|transfer)[^\n]*?(\d+)/i);
            const reservedAmountMatch = trimmed.match(/Amount:\s*Rs\s*(\d+)/);
            if ((lockedMatch || reservedAmountMatch) && trimmed.toLowerCase().includes('slot')) {
                const amount = parseInt(lockedMatch ? lockedMatch[1] : reservedAmountMatch[1], 10);
                const bookingRefMatch = trimmed.match(/Booking Ref:\s*([A-Z]+-\d+[A-Z]*)/i);
                return { type: 'locked', amount: amount, bookingRef: bookingRefMatch ? bookingRefMatch[1] : '', fullText: trimmed };
            }

            const bookingIdMatch = trimmed.match(/Booking (?:ID|Ref):\s*([A-Za-z0-9-_]+)/);
            const amountMatch = trimmed.match(/Amount:\s*Rs\s*(\d+)/);
            if ((trimmed.toLowerCase().includes('payment received') || trimmed.toLowerCase().includes('booking confirmed')) && bookingIdMatch && amountMatch) {
                return { type: 'confirmed', bookingId: bookingIdMatch[1], amount: parseInt(amountMatch[1], 10), fullText: trimmed };
            }

            const headerMatch = trimmed.match(/📅\s*(.+?)\s+ko\s+(.+?)\s+me\s+\*\*(.+?)\*\*\s+ke\s+(\d+)\s+slot/i);
            if (headerMatch) {
                const venues = [];
                const lines = trimmed.split('\n');
                let currentVenue = null;
                const slotRe = /^\s*[-–]\s*(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})\s*\(Rs\s*(\d+)\)\s*ID:\s*([a-z0-9_]+)/i;

                for (const line of lines) {
                    const venueMatch = line.match(/^\s*\*\*(.+?)\*\*\s*\(([^)]+)\)/);
                    if (venueMatch) {
                        currentVenue = { name: venueMatch[1].trim(), address: venueMatch[2].trim(), slots: [] };
                        venues.push(currentVenue);
                        continue;
                    }
                    const slotMatch = line.match(slotRe);
                    if (slotMatch && currentVenue) {
                        currentVenue.slots.push({
                            time: slotMatch[1],
                            end: slotMatch[2],
                            price: parseInt(slotMatch[3], 10),
                            slotId: slotMatch[4]
                        });
                    }
                }

                const ctaMatch = trimmed.match(/["']Confirm \[Slot ID\][^"'\n]*["']/);
                if (venues.some(v => v.slots.length > 0)) {
                    return {
                        type: 'slots',
                        header: { line: headerMatch[0], date: headerMatch[1], area: headerMatch[2], sport: headerMatch[3], count: headerMatch[4] },
                        venues: venues.filter(v => v.slots.length > 0),
                        cta: ctaMatch ? ctaMatch[0] : 'Type "Confirm [Slot ID]" to book.'
                    };
                }
            }

            return { type: 'plain', text: trimmed };
        }

        function renderMessage(content, type) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', type);

            const parsed = type === 'incoming' ? parseAgentResponse(content) : { type: 'plain', text: content };

            if (type === 'outgoing') {
                const contentDiv = document.createElement('div');
                contentDiv.classList.add('message-content');
                contentDiv.textContent = content;
                const timeDiv = document.createElement('div');
                timeDiv.classList.add('message-time');
                timeDiv.innerHTML = formatTime() + '<span class="message-status">✓✓</span>';
                msgDiv.appendChild(contentDiv);
                msgDiv.appendChild(timeDiv);
            } else if (parsed.type === 'slots') {
                const card = document.createElement('div');
                card.classList.add('slot-results-card');
                card.innerHTML = '<div class="slot-results-header">' + parsed.header.line.replace(/\*\*/g, '') + '</div>';
                for (const venue of parsed.venues) {
                    const section = document.createElement('div');
                    section.classList.add('venue-section');
                    const slotsToShow = venue.slots.slice(0, MAX_SLOTS_PER_VENUE);
                    let slotHtml = '';
                    for (const slot of slotsToShow) {
                        slotHtml += '<div class="slot-card" data-slot-id="' + slot.slotId + '">' +
                            '<div class="slot-time">' + slot.time + ' – ' + slot.end + '</div>' +
                            '<div class="slot-price">Rs ' + slot.price + '</div>' +
                            '<button type="button" class="slot-select-btn" data-slot-id="' + slot.slotId + '">Select</button>' +
                            '</div>';
                    }
                    if (venue.slots.length > MAX_SLOTS_PER_VENUE) {
                        slotHtml += '<div class="slot-card" style="grid-column:1/-1;cursor:default;opacity:0.8">+' + (venue.slots.length - MAX_SLOTS_PER_VENUE) + ' more slots</div>';
                    }
                    section.innerHTML = '<div class="venue-header">' + venue.name + '</div>' +
                        '<div class="venue-address">' + venue.address + '</div>' +
                        '<div class="slot-grid">' + slotHtml + '</div>';
                    card.appendChild(section);
                }
                card.innerHTML += '<div class="slot-cta">' + (parsed.cta || '') + '</div>';
                card.querySelectorAll('.slot-card[data-slot-id]').forEach(el => {
                    const sid = el.getAttribute('data-slot-id');
                    if (sid) {
                        el.addEventListener('click', (e) => {
                            e.preventDefault();
                            messageInput.value = 'Confirm ' + sid;
                            messageInput.focus();
                        });
                    }
                });
                const timeDiv = document.createElement('div');
                timeDiv.classList.add('message-time');
                timeDiv.textContent = formatTime();
                msgDiv.appendChild(card);
                msgDiv.appendChild(timeDiv);
            } else if (parsed.type === 'locked') {
                const card = document.createElement('div');
                card.classList.add('confirmation-card', 'locked');
                let cardHtml = '<div class="confirmation-header">' +
                    '<div class="confirmation-title">Slot Reserved</div>' +
                    '</div>' +
                    '<div class="confirmation-details">';
                if (parsed.bookingRef) {
                    cardHtml += '<div class="confirmation-row">' +
                        '<span class="confirmation-label">Booking Ref</span>' +
                        '<span class="confirmation-value mono">' + parsed.bookingRef + '</span>' +
                        '</div>';
                }
                cardHtml += '<div class="confirmation-row">' +
                    '<span class="confirmation-label">Total Amount</span>' +
                    '<span class="confirmation-amount">Rs ' + parsed.amount + '</span>' +
                    '</div>' +
                    '</div>' +
                    '<div class="confirmation-cta">Please transfer the amount and send a screenshot within 10 minutes to secure your slot.</div>';
                card.innerHTML = cardHtml;
                const timeDiv = document.createElement('div');
                timeDiv.classList.add('message-time');
                timeDiv.textContent = formatTime();
                msgDiv.appendChild(card);
                msgDiv.appendChild(timeDiv);
            } else if (parsed.type === 'confirmed') {
                const card = document.createElement('div');
                card.classList.add('confirmation-card', 'confirmed');
                card.innerHTML = '<div class="confirmation-header">' +
                    '<div class="confirmation-title">Booking Confirmed</div>' +
                    '</div>' +
                    '<div class="confirmation-details">' +
                    '<div class="confirmation-row">' +
                    '<span class="confirmation-label">Booking ID</span>' +
                    '<span class="confirmation-value mono">' + parsed.bookingId + '</span>' +
                    '</div>' +
                    '<div class="confirmation-row">' +
                    '<span class="confirmation-label">Amount Paid</span>' +
                    '<span class="confirmation-amount">Rs ' + parsed.amount + '</span>' +
                    '</div>' +
                    '</div>' +
                    '<div class="confirmation-cta">Thank you for booking with us. See you soon.</div>';
                const timeDiv = document.createElement('div');
                timeDiv.classList.add('message-time');
                timeDiv.textContent = formatTime();
                msgDiv.appendChild(card);
                msgDiv.appendChild(timeDiv);
            } else {
                const contentDiv = document.createElement('div');
                contentDiv.classList.add('message-content');
                contentDiv.textContent = parsed.text || content;
                const timeDiv = document.createElement('div');
                timeDiv.classList.add('message-time');
                timeDiv.textContent = formatTime();
                msgDiv.appendChild(contentDiv);
                msgDiv.appendChild(timeDiv);
            }

            chatContainer.insertBefore(msgDiv, typingIndicator);
            scrollToBottom();
        }

        const CHAT_TIMEOUT_MS = 120000;

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            messageInput.value = '';
            renderMessage(text, 'outgoing');
            showTyping('Checking availability…');

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), CHAT_TIMEOUT_MS);

            try {
                const response = await fetch(API_URL + '/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, phone_number: PHONE_NUMBER }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                let data;
                try { data = await response.json(); } catch (_) {
                    hideTyping();
                    renderMessage('Server returned an invalid response. Try again.', 'incoming');
                    return;
                }

                hideTyping();
                if (response.ok) {
                    renderMessage(data.response, 'incoming');
                } else {
                    renderMessage('Error: ' + (data.detail || 'Failed to send message'), 'incoming');
                }
            } catch (error) {
                clearTimeout(timeoutId);
                hideTyping();
                if (error.name === 'AbortError') {
                    renderMessage('Request took too long. Check that the backend is running and try again.', 'incoming');
                } else if (error.message && error.message.toLowerCase().includes('fetch')) {
                    renderMessage('Could not reach the server. Make sure the backend is running (e.g. python scripts/chat_web.py) and try again.', 'incoming');
                } else {
                    renderMessage('Network Error: ' + error.message, 'incoming');
                }
            }
        }

        function renderOutgoingImage(file) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', 'outgoing');
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.alt = file.name;
            img.style.cssText = 'max-width:220px;max-height:220px;border-radius:10px;display:block;margin-bottom:4px;';
            const timeDiv = document.createElement('div');
            timeDiv.classList.add('message-time');
            timeDiv.innerHTML = formatTime() + '<span class="message-status">✓✓</span>';
            msgDiv.appendChild(img);
            msgDiv.appendChild(timeDiv);
            chatContainer.insertBefore(msgDiv, typingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function uploadImage(file) {
            renderOutgoingImage(file);
            showTyping('Processing payment…');

            const formData = new FormData();
            formData.append('file', file);
            formData.append('phone_number', PHONE_NUMBER);

            try {
                const response = await fetch(API_URL + '/upload-image', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                hideTyping();
                if (response.ok) {
                    renderMessage(data.response, 'incoming');
                } else {
                    renderMessage('Error: ' + (data.detail || 'Unknown error'), 'incoming');
                }
            } catch (error) {
                hideTyping();
                renderMessage('Network Error: ' + error.message, 'incoming');
            }
        }

        async function clearHistory() {
            if (!confirm('Clear conversation history?')) return;
            try {
                const response = await fetch(API_URL + '/clear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone_number: PHONE_NUMBER })
                });
                if (response.ok) {
                    [...chatContainer.children].forEach(c => { if (c !== typingIndicator) c.remove(); });
                    if (!chatContainer.contains(typingIndicator)) chatContainer.appendChild(typingIndicator);
                    renderMessage('Conversation cleared.', 'incoming');
                } else {
                    alert('Failed to clear history');
                }
            } catch (error) {
                alert('Error clearing history');
            }
        }
    </script>
</body>

</html>
