<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Dev Chat</title>
    <style>
        :root {
            --bg-color: #111b21;
            --header-bg: #202c33;
            --chat-bg: #0b141a;
            --incoming-bg: #202c33;
            --outgoing-bg: #005c4b;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --input-bg: #2a3942;
            --accent: #00a884;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 1600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
            background-size: 400px;
            opacity: 0.95;
        }

        /* Overlay to darken background image */
        .app-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--chat-bg);
            opacity: 0.9;
            z-index: -1;
        }

        header {
            background-color: var(--header-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .user-details h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
        }

        .user-details span {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .actions button {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
        }

        .actions button:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 5%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 65%;
            padding: 6px 7px 8px 9px;
            border-radius: 7.5px;
            font-size: 14.2px;
            line-height: 19px;
            position: relative;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.incoming {
            align-self: flex-start;
            background-color: var(--incoming-bg);
            border-top-left-radius: 0;
        }

        .message.outgoing {
            align-self: flex-end;
            background-color: var(--outgoing-bg);
            border-top-right-radius: 0;
        }

        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-time {
            float: right;
            margin-left: 10px;
            margin-top: 4px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }

        .message-status {
            display: inline-block;
            margin-left: 3px;
            color: #53bdeb;
        }

        .input-area {
            background-color: var(--header-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #message-input {
            flex: 1;
            background-color: var(--input-bg);
            border: none;
            border-radius: 8px;
            padding: 9px 12px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
        }

        #send-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }

        #send-btn:hover {
            color: var(--accent);
        }

        .typing-indicator {
            display: none;
            padding: 10px;
            background-color: var(--incoming-bg);
            border-radius: 10px;
            border-top-left-radius: 0;
            align-self: flex-start;
            margin-bottom: 10px;
            width: fit-content;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header>
            <div class="user-info">
                <div class="avatar">🤖</div>
                <div class="user-details">
                    <h2>Agent</h2>
                    <span id="header-status">online</span>
                </div>
            </div>
            <div class="actions">
                <button onclick="clearHistory()" title="Clear Chat History">🗑️</button>
            </div>
        </header>

        <div id="chat-container">
            <div class="typing-indicator" id="typing-indicator">
                <div class="typing-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <button>😊</button>
            <button onclick="document.getElementById('image-input').click()">📎</button>
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <input type="text" id="message-input" placeholder="Type a message">
            <button id="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const API_URL = '/dev-api';
        const PHONE_NUMBER = '+923001234567';

        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const imageInput = document.getElementById('image-input');
        const typingIndicator = document.getElementById('typing-indicator');

        messageInput.focus();

        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        imageInput.addEventListener('change', function () {
            if (this.files && this.files[0]) {
                uploadImage(this.files[0]);
                this.value = '';
            }
        });

        function formatTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function addMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', type);

            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            contentDiv.innerText = text;

            const timeDiv = document.createElement('div');
            timeDiv.classList.add('message-time');

            let timeHtml = formatTime();
            if (type === 'outgoing') {
                timeHtml += '<span class="message-status">✓✓</span>';
            }
            timeDiv.innerHTML = timeHtml;

            msgDiv.appendChild(contentDiv);
            msgDiv.appendChild(timeDiv);

            chatContainer.insertBefore(msgDiv, typingIndicator);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            typingIndicator.style.display = 'block';
            document.getElementById('header-status').innerText = 'typing...';
            scrollToBottom();
        }

        function hideTyping() {
            typingIndicator.style.display = 'none';
            document.getElementById('header-status').innerText = 'online';
        }

        const CHAT_TIMEOUT_MS = 60000;

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            messageInput.value = '';
            addMessage(text, 'outgoing');
            showTyping();

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), CHAT_TIMEOUT_MS);

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, phone_number: PHONE_NUMBER }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                let data;
                try {
                    data = await response.json();
                } catch (_) {
                    hideTyping();
                    addMessage('Server returned an invalid response. Try again.', 'incoming');
                    return;
                }

                hideTyping();
                if (response.ok) {
                    addMessage(data.response, 'incoming');
                } else {
                    addMessage(`Error: ${data.detail || 'Failed to send message'}`, 'incoming');
                }
            } catch (error) {
                clearTimeout(timeoutId);
                hideTyping();
                if (error.name === 'AbortError') {
                    addMessage('Request took too long. Check that the backend is running and try again.', 'incoming');
                } else if (error.message && error.message.toLowerCase().includes('fetch')) {
                    addMessage('Could not reach the server. Make sure the backend is running (e.g. python scripts/chat_web.py) and try again.', 'incoming');
                } else {
                    addMessage(`Network Error: ${error.message}`, 'incoming');
                }
                console.error('Error:', error);
            }
        }

        async function uploadImage(file) {
            addMessage(`[Sending Image: ${file.name}]`, 'outgoing');
            showTyping();

            const formData = new FormData();
            formData.append('file', file);
            formData.append('phone_number', PHONE_NUMBER);

            try {
                const response = await fetch(`${API_URL}/upload-image`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                hideTyping();

                if (response.ok) {
                    addMessage(data.response, 'incoming');
                } else {
                    addMessage(`Error uploading image: ${data.detail || 'Unknown error'}`, 'incoming');
                }
            } catch (error) {
                hideTyping();
                addMessage(`Network Error: ${error.message}`, 'incoming');
            }
        }

        async function clearHistory() {
            if (!confirm('Are you sure you want to clear the conversation history?')) return;

            try {
                const response = await fetch(`${API_URL}/clear`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone_number: PHONE_NUMBER })
                });

                if (response.ok) {
                    chatContainer.innerHTML = '';
                    chatContainer.appendChild(typingIndicator);
                    addMessage('Conversation history cleared.', 'incoming');
                } else {
                    alert('Failed to clear history');
                }
            } catch (error) {
                console.error('Error clearing history:', error);
                alert('Error clearing history');
            }
        }

        setTimeout(() => {}, 500);
    </script>
</body>

</html>
